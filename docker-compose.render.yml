version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${PORT:-80}:${PORT:-80}"
    depends_on:
      - web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-80}
      - REACT_APP_API_URL=https://unwindmind-backend.onrender.com
    # Performance optimizations
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  web:
    build: 
      context: ./mentalhealthwebapp
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: dpg-d33fa3odl3ps738rcem0-a.oregon-postgres.render.com
      DB_PORT: 5432
      DB_CONNECTION_STRING: postgresql://postgres_w55i_user:X2Ql4NcLRRmdDcEq31o4K5qhsclQHToh@dpg-d33fa3odl3ps738rcem0-a.oregon-postgres.render.com/postgres_w55i
      DATABASE_URL: postgresql://postgres_w55i_user:X2Ql4NcLRRmdDcEq31o4K5qhsclQHToh@dpg-d33fa3odl3ps738rcem0-a.oregon-postgres.render.com/postgres_w55i
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: 8080
      CORS_ORIGIN: https://unwindmind-frontend.onrender.com
      # Go performance tuning
      GOGC: 20
      GOMAXPROCS: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Performance optimizations
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

