name: Deploy Backend to Railway

on:
  push:
    branches: [ main ]
    paths:
      - 'mentalhealthwebapp/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mentalhealthwebapp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway up --service ${{ vars.RAILWAY_SERVICE_NAME || 'unwindmind-api' }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f ${{ vars.BACKEND_URL }}/health || echo "Health check failed, but deployment may still be in progress"