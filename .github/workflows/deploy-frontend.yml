name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # Disable cache to avoid lock file dependency issues
          # cache: 'npm'
          # cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          # Check if lockfile exists and is in sync
          if [ -f package-lock.json ]; then
            echo "📦 Found package-lock.json, attempting npm ci..."
            if npm ci --prefer-offline --cache .npm-cache; then
              echo "✅ npm ci succeeded"
            else
              echo "⚠️ npm ci failed due to sync issues, regenerating lockfile..."
              rm package-lock.json
              npm install --package-lock-only --no-audit
              echo "🔄 Retrying npm ci with fresh lockfile..."
              npm ci --prefer-offline --cache .npm-cache
            fi
          else
            echo "📦 No lockfile found, running npm install..."
            npm install
          fi

      - name: Build application
        run: |
          # Create npm cache directory
          mkdir -p .npm-cache
          
          # Build with resilient npm handling
          npm run build:ci
        env:
          CI: false
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'https://unwindmind-api.railway.app' }}
          REACT_APP_ENVIRONMENT: production

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/build

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4