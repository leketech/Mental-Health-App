services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Railway Database (takes precedence)
      DATABASE_URL: ${DATABASE_URL}
      
      # Application Configuration
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      PORT: ${PORT:-8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://www.unwindmind.life}
      
      # Optional PostgreSQL individual variables
      PGDATABASE: ${PGDATABASE:-railway}
      PGHOST: ${PGHOST:-postgres-kjnv.railway.internal}
      PGPASSWORD: ${PGPASSWORD}
      PGUSER: ${PGUSER:-postgres}
      PGPORT: ${PGPORT:-5432}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    driver: bridge