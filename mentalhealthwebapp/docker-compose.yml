services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://unwindmind-api.railway.app
    ports:
      - "80:80"
    depends_on:
      - web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://unwindmind-api.railway.app

  web:
    build: 
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_CONNECTION_STRING: postgres://mental_user:mental_pass@db:5432/mental_db?sslmode=disable
      JWT_SECRET: this-is-a-very-long-secret-key-for-development-use-only-change-in-production-xxxxxx
      PORT: 8080
      CORS_ORIGIN: https://www.unwindmind.life
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mental_db
      POSTGRES_USER: mental_user
      POSTGRES_PASSWORD: mental_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mental_user -d mental_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    shm_size: 256mb

volumes:
  pgdata:
    driver: local

networks:
  default:
    driver: bridge