services:
  - type: web
    name: unwindmind-app
    env: docker
    rootDir: mentalhealthwebapp
    dockerfilePath: Dockerfile.production
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8080
    healthCheckPath: /health
    autoDeploy: false

databases:
  - name: unwindmind-db
    plan: free
    databaseName: unwindmind