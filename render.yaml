services:
  - type: web
    name: unwindmind-app
    env: docker
    rootDir: mentalhealthwebapp
    dockerCommand: docker-compose -f docker-compose.render.yml up
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 80
    healthCheckPath: /health
    autoDeploy: false

databases:
  - name: unwindmind-db
    plan: free
    databaseName: unwindmind