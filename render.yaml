services:
  - type: web
    name: unwindmind-backend
    env: docker
    rootDir: .
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 8080
      - key: CORS_ORIGIN
        value: https://unwindmind-frontend.onrender.com
    healthCheckPath: /health
    autoDeploy: false

databases:
  - name: unwindmind-db
    plan: free
    databaseName: unwindmind