# render.yaml - UnwindMind Mental Health App Deployment
services:
  # Backend API Service
  - type: web
    name: unwindmind-api
    env: go
    region: oregon
    plan: starter
    rootDir: mentalhealthwebapp
    buildCommand: go mod tidy && go build -o main .
    startCommand: ./main
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_CONNECTION_STRING
        fromService:
          name: unwindmind-postgres
          property: connectionString
      - key: CORS_ORIGIN
        value: https://unwindmind.life
    healthCheckPath: /health

  # Frontend Static Site
  - type: static
    name: unwindmind-frontend
    region: oregon
    plan: starter
    buildCommand: cd frontend && npm ci --prefer-offline && npm run build:ci
    publishPath: frontend/build
    domains:
      - unwindmind.life
      - www.unwindmind.life
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: unwindmind-api
          property: host
      - key: REACT_APP_ENVIRONMENT
        value: production

  # PostgreSQL Database
  - type: postgres
    name: unwindmind-postgres
    region: oregon
    plan: starter
    databaseName: unwindmind_db
    user: unwindmind_user