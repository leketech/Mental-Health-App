<!DOCTYPE html>
<html>
<head>
    <title>Test Page</title>
</head>
<body>
    <h1>Frontend Deployment Test</h1>
    <p>If you can see this page, the static file serving is working correctly.</p>
    <p>The React app should load below:</p>
    <div id="root"></div>
    <script>
        // Simple test to check if JavaScript is running
        document.addEventListener('DOMContentLoaded', function() {
            var root = document.getElementById('root');
            root.innerHTML = '<p style="color: green;">JavaScript is running correctly!</p>';
        });
    </script>
</body>
</html>
